		<style>
			.container {
				max-width: 700px;
				margin: auto;
				border-style: double;
				border-color: blue;
				padding: 20px;
				margin-top: 20px;

			}

                border-color: dodgerblue;

	<body class="rainbow-bg">
		<tool-bar altlinks="/sitemap.html"></tool-bar>
		<br />
		<div class="container">
			<h2 class="title"><span class="rainbow-heading" id="rainbow-blinkies">BLINKIES</span></h2>
			<hr />
			<badges-display type="main"></badges-display>
			<hr />
			<h2 class="title"><span class="rainbow-heading" id="rainbow-stamps">STAMPS</span></h2>
			<badges-display type="extra"></badges-display>
			<div id="badges-note">
				<p>
					Some fun blinkies!<br />

				</p>
			</div>
			<hr />
			<p class="last-updated">
				“A game is a series of interesting choices”
			</p>
		</div>
		<br />
	<script>
		var bits=80, speed=33, bangs=5;
		var colours=["#03f","#f03","#0e0","#93f","#0cf","#f93","#f0c"];
		var bangheight=[], intensity=[], colour=[], Xpos=[], Ypos=[], dX=[], dY=[], stars=[], decay=[];
		var swide=800, shigh=600, boddie;

		window.addEventListener('load', function() {
			boddie=document.createElement("div");
			boddie.style.cssText="position:fixed;top:0;left:0;overflow:visible;width:1px;height:1px;pointer-events:none;z-index:9999;";
			document.body.appendChild(boddie);
			set_width();
			for (var i=0; i<bangs; i++) {
				write_fire(i);
				launch(i);
				(function(n){ setInterval(function(){ stepthrough(n); }, speed); })(i);
			}
		});

		window.addEventListener('resize', set_width);

		function set_width() {
			swide = window.innerWidth || document.documentElement.clientWidth || 800;
			shigh = window.innerHeight || document.documentElement.clientHeight || 600;
		}

		function write_fire(N) {
			stars[N+'r'] = createDiv('|', 12);
			boddie.appendChild(stars[N+'r']);
			for (var i=bits*N; i<bits+bits*N; i++) {
				stars[i] = createDiv('*', 13);
				boddie.appendChild(stars[i]);
			}
		}

		function createDiv(char, size) {
			var div = document.createElement("div");
			div.style.cssText = "font:"+size+"px monospace;position:absolute;background:transparent;";
			div.appendChild(document.createTextNode(char));
			return div;
		}

		function launch(N) {
			colour[N] = Math.floor(Math.random()*colours.length);
			Xpos[N+"r"] = swide*0.5;
			Ypos[N+"r"] = shigh-5;
			bangheight[N] = Math.round((0.5+Math.random())*shigh*0.4);
			dX[N+"r"] = (Math.random()-0.5)*swide/bangheight[N];
			stars[N+"r"].firstChild.nodeValue = dX[N+"r"]>1.25 ? "/" : dX[N+"r"]<-1.25 ? "\\" : "|";
			stars[N+"r"].style.color = colours[colour[N]];
		}

		function bang(N) {
			var i, Z, A=0;
			for (i=bits*N; i<bits+bits*N; i++) {
				Z = stars[i].style;
				Z.left = Xpos[i]+"px";
				Z.top  = Ypos[i]+"px";
				if (decay[i]) decay[i]--; else A++;
				if (decay[i]==15) Z.fontSize="7px";
				else if (decay[i]==7) Z.fontSize="2px";
				else if (decay[i]==1) Z.visibility="hidden";
				if (decay[i]>1 && Math.random()<.1) {
					Z.visibility="hidden";
					(function(idx){ setTimeout(function(){ stars[idx].style.visibility="visible"; }, speed-1); })(i);
				}
				Xpos[i] += dX[i];
				Ypos[i] += (dY[i] += 1.25/intensity[N]);
			}
			if (A!=bits) setTimeout(function(){ bang(N); }, speed);
		}

		function stepthrough(N) {
			var i, M, Z;
			var oldx=Xpos[N+"r"], oldy=Ypos[N+"r"];
			Xpos[N+"r"] += dX[N+"r"];
			Ypos[N+"r"] -= 4;
			if (Ypos[N+"r"] < bangheight[N]) {
				M = Math.floor(Math.random()*3*colours.length);
				intensity[N] = 5+Math.random()*4;
				for (i=N*bits; i<bits+bits*N; i++) {
					Xpos[i]=Xpos[N+"r"]; Ypos[i]=Ypos[N+"r"];
					dY[i]=(Math.random()-0.5)*intensity[N];
					dX[i]=(Math.random()-0.5)*(intensity[N]-Math.abs(dY[i]))*1.25;
					decay[i]=16+Math.floor(Math.random()*16);
					Z=stars[i];
					if (M<colours.length) Z.style.color=colours[i%2?colour[N]:M];
					else if (M<2*colours.length) Z.style.color=colours[colour[N]];
					else Z.style.color=colours[i%colours.length];
					Z.style.fontSize="13px";
					Z.style.visibility="visible";
				}
				bang(N);
				launch(N);
			}
			stars[N+"r"].style.left=oldx+"px";
			stars[N+"r"].style.top=oldy+"px";
		}
	</script>

	<script>
		var rainCol = ["#ff0000","#ff5500","#ffaa00","#ffff00","#aaff00","#55ff00","#00ff00","#00ff55","#00ffaa","#00ffff","#00aaff","#0055ff","#0000ff","#5500ff","#aa00ff","#ff00ff","#ff00aa","#ff0055"];
		var rainCnt = 0;

		function initRainbow(id) {
			var el = document.getElementById(id);
			if (!el) return;
			var txt = el.textContent;
			el.innerHTML = '';
			for (var i = 0; i < txt.length; i++) {
				var span = document.createElement("span");
				span.id = id + "-" + i;
				span.appendChild(document.createTextNode(txt.charAt(i)));
				el.appendChild(span);
			}
			return txt;
		}

		window.addEventListener('load', function() {
			var blinkiesTxt = initRainbow('rainbow-blinkies');
			var stampsTxt   = initRainbow('rainbow-stamps');
			var cnt = 0;
			setInterval(function() {
				[['rainbow-blinkies', blinkiesTxt], ['rainbow-stamps', stampsTxt]].forEach(function(pair) {
					for (var i = 0; i < pair[1].length; i++) {
						var c = rainCol[(i + cnt) % rainCol.length];
						var el = document.getElementById(pair[0] + "-" + i);
						if (el) { el.style.color = c; el.style.textShadow = c + " 0 0 4px"; }
					}
				});
				cnt++;
			}, 100);
		});
	</script>
	</body>

</html>

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=contain" name="viewport" />

    <title>[ TERMINAL ]</title>
    <link href="favicon.ico" rel="icon" type="image/x-icon" />
    <link href="style.css" media="all" rel="stylesheet" type="text/css" />

    <script src="js/component/fun-display.js" type="text/javascript"></script>
    <script src="js/site-util.js"></script>
    <script src="js/component/toolbar.js" type="text/javascript"></script>

    <style>

        .container {
            position: relative;
            max-width: 700px;
            padding: 0px 20px;
            padding-bottom: 10px;
            margin: 0px auto;
            margin-top: 20px;
            background-color: rgba(0, 0, 0, 0.781);
            z-index: 10;
            border-style: double;
            border-color: var(--dark-blue);
        }

        hr {
            color: dodgerblue;
            border-color: dodgerblue;
        }

        p {
            width: fit-content;
            color: gray;
            font-family: "Consolas";
            font-size: 1em;
        }

        h3 {
            font-family: "Silkscreen";
            color: cornflowerblue;
            width: fit-content;
            margin-top: 20px;
        }

        .last-updated {
            color: gray;
            font-family: "Consolas";
            font-size: 0.8em;
        }

    </style>
</head>

<body class="rainbow-bg">

    <canvas id="matrix-overlay" style="position:fixed;inset:0;width:100%;height:100%;z-index:9999;transition:opacity 1.2s ease;"></canvas>
    <canvas id="matrix-ambient" style="position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0;transition:opacity 1s ease;"></canvas>


    <script>
        (function() {
            var canvas = document.getElementById('matrix-overlay');
            var ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            var fs = 16;
            var cols = Math.floor(canvas.width / fs);
            var drops = [];
            for (var i = 0; i < cols; i++) drops[i] = Math.random() * -50;
            var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%[]<>!?';

            function draw() {
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.font = fs + 'px monospace';
                for (var i = 0; i < drops.length; i++) {
                    var ch = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillStyle = '#00BFFF';
                    ctx.fillText(ch, i * fs, drops[i] * fs);
                    ctx.fillStyle = '#FF0047';
                    ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fs, (drops[i] - 1) * fs);
                    if (drops[i] * fs > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }

            // fill black immediately so page isn't visible on load
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            var interval = setInterval(draw, 50);

            setTimeout(function() {
                canvas.style.opacity = '0';
                setTimeout(function() { canvas.remove(); clearInterval(interval); }, 1300);
            }, 6000);
        })();
    </script>

    <script>
        (function() {
            var canvas = document.getElementById('matrix-ambient');
            var ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            var fs = 16;
            var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%[]<>!?';
            var totalCols = Math.floor(canvas.width / fs);

            // sparse active columns — only a few at a time
            var active = {};

            function spawnColumn() {
                var col = Math.floor(Math.random() * totalCols);
                active[col] = 0;
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.font = fs + 'px monospace';

                for (var col in active) {
                    var y = active[col];
                    var ch = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillStyle = '#FF0047';
                    ctx.fillText(ch, col * fs, y * fs);
                    ctx.fillStyle = '#00BFFF';
                    ctx.fillText(chars[Math.floor(Math.random() * chars.length)], col * fs, (y - 1) * fs);
                    ctx.fillStyle = 'rgba(0,191,255,0.4)';
                    ctx.fillText(chars[Math.floor(Math.random() * chars.length)], col * fs, (y - 2) * fs);
                    active[col]++;
                    if (active[col] * fs > canvas.height) delete active[col];
                }
            }

            // start after intro finishes
            setTimeout(function() {
                canvas.style.opacity = '1';
                setInterval(draw, 50);
                // spawn 1-2 columns every few seconds
                setInterval(function() {
                    var count = Math.floor(Math.random() * 2) + 1;
                    for (var i = 0; i < count; i++) spawnColumn();
                }, 2500);
            }, 7500);
        })();
    </script>

    <tool-bar reducedmotion="hide" altlinks="/sitemap.html"></tool-bar>
    <br />
    <div class="container">
        <h3>Terminal</h3>
        <fun-display type="learn"></fun-display>
        <hr />
        <h3>Loading...</h3>
        <fun-display type="notes"></fun-display>
        <hr />
        <p class="last-updated">
            "The more that you read, the more things you will know. The more that you learn, the more places you'll go."
        </p>
    </div>
    <br />
</body>

</html>

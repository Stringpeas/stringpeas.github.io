	<title>[ PROJECTS ]</title>
	<style>
		@keyframes animated-grid-primary {
			from { background-position: 0 0; }
			to   { background-position: 250px 250px; }
		}

		@keyframes shimmer {
			0%   { text-shadow: 0 0 6px deepskyblue, 0 0 14px deepskyblue; }
			50%  { text-shadow: 0 0 14px deepskyblue, 0 0 30px deepskyblue, 0 0 50px rgba(0,191,255,0.4); }
			100% { text-shadow: 0 0 6px deepskyblue, 0 0 14px deepskyblue; }
		}

		body { margin: 0; }

		.grid-background {
			position: fixed;
			left: 0; top: 0;
			width: 100%; height: 100dvh;
			background-size: 400px;
			background-image: url("img/asset/grid-icons.png");
		}

		#grid-primary {
			animation: animated-grid-primary 40s linear infinite;
			background-size: 250px;
		}

		#page {
			position: relative;
			max-width: 1000px;
			margin: 0 auto;
			padding: 60px 24px 80px;
		}

		/* â”€â”€ YEAR DIVIDER â”€â”€ */
		.year-section { margin-bottom: 60px; }

		.year-divider {
			display: flex;
			align-items: center;
			gap: 16px;
			margin-bottom: 24px;
		}

		.year-label {
			font-family: "Silkscreen";
			font-size: 2.2em;
			color: deepskyblue;
			white-space: nowrap;
			flex-shrink: 0;
			position: relative;
			display: inline-block;
		}

		.year-num {
			position: relative;
			display: inline-block;
			animation: shimmer 3s ease-in-out infinite;
		}

		.year-word {
			position: relative;
			display: inline-block;
		}

		.year-line {
			flex-grow: 1;
			height: 0;
			border: none;
			border-top: 3px double dodgerblue;
			opacity: 0.5;
		}

		/* â”€â”€ PROJECT CARDS ROW â”€â”€ */
		.projects-row {
			display: flex;
			flex-wrap: wrap;
			gap: 16px;
		}

		.project-link {
			text-decoration: none;
			flex: 1 1 260px;
			min-width: 200px;
			max-width: 380px;
		}

		.project-card {
			border: 3px double dodgerblue;
			background: rgba(0, 0, 0, 0.85);
			position: relative;
			overflow: hidden;
			transition: border-color 0.15s, transform 0.15s;
		}

		.project-card:hover {
			border-color: #FF0047;
			transform: translateY(-4px);
		}

		.project-card img {
			width: 100%;
			height: 280px;
			object-fit: cover;
			object-position: center center;
			display: block;
		}

		.project-name {
			font-family: "Silkscreen";
			font-size: 1.2em;
			color: #FF0047;
			background: black;
			border-top: 1px solid dodgerblue;
			margin: 0;
			padding: 10px 10px;
			text-transform: uppercase;
			letter-spacing: 2px;
			transition: background 0.15s, color 0.15s;
			text-shadow: 1px 1px 0 black, 1px -1px 0 black, -1px -1px 0 black, -1px 1px 0 black, -2px 2px 0 black;
		}

		.project-card:hover .project-name {
			background: #FF0047;
			color: black;
			text-shadow: none;
		}

		/* â”€â”€ COMING SOON BADGE â”€â”€ */
		.badge-soon {
			position: absolute;
			top: 8px; right: 8px;
			font-family: "Silkscreen";
			font-size: 0.6em;
			background: #FF0047;
			color: white;
			padding: 3px 7px;
			letter-spacing: 1px;
		}

		@media screen and (max-width: 700px) {
			.project-link { max-width: 100%; }
			.year-label { font-size: 1.6em; }
		}
	</style>

	<script>
		function getElWidth(el) {
			return el.offsetWidth || el.clientWidth || 0;
		}

		function initShuffle(el, speed) {
			var txt = el.firstChild ? el.firstChild.nodeValue : null;
			if (!txt) return;
			while (el.childNodes.length) el.removeChild(el.childNodes[0]);

			for (var i = 0; i < txt.length; i++) {
				var span = document.createElement('span');
				span.id = el.id + '_shuf' + i;
				span.style.position = 'relative';
				span.appendChild(document.createTextNode(txt.charAt(i)));
				el.appendChild(span);
			}

			var sorpos = [];
			for (var i = 0; i < txt.length; i++) {
				sorpos[i] = (sorpos[i - 1] || 0) + getElWidth(document.getElementById(el.id + '_shuf' + i));
			}

			var shfpos = [];
			for (var i = 0; i < txt.length; i++) shfpos[i] = i;
			for (var i = 0; i < txt.length; i++) {
				var j = Math.floor(Math.random() * txt.length);
				var tmp = shfpos[i]; shfpos[i] = shfpos[j]; shfpos[j] = tmp;
			}

			var left = 0;
			for (var i = 0; i < txt.length; i++) {
				var span = document.getElementById(el.id + '_shuf' + shfpos[i]);
				span.style.left = (left - (sorpos[shfpos[i] - 1] || 0)) + 'px';
				left += getElWidth(span);
			}

			unshuffle(el.id, txt, shfpos, speed);
		}

		function unshuffle(elId, txt, shfpos, speed) {
			var go = 0;
			for (var i = 0; i < txt.length; i++) if (shfpos[i] !== i) go++;
			if (!go) return;

			var rpos;
			do { rpos = Math.floor(Math.random() * (txt.length - 1)); }
			while (shfpos[rpos] < shfpos[rpos + 1]);

			var s1 = shfpos[rpos], s2 = shfpos[rpos + 1];
			shfpos[rpos] = s2; shfpos[rpos + 1] = s1;

			var c1 = document.getElementById(elId + '_shuf' + s1);
			var c2 = document.getElementById(elId + '_shuf' + s2);
			var w1 = getElWidth(c1), w2 = getElWidth(c2);

			for (var i = 0; i < w2; i++) (function(i) {
				setTimeout(function() { c1.style.left = (parseInt(c1.style.left) + 1) + 'px'; }, speed / w2 * i);
			})(i);
			for (var i = 0; i < w1; i++) (function(i) {
				setTimeout(function() { c2.style.left = (parseInt(c2.style.left) - 1) + 'px'; }, speed / w1 * i);
			})(i);

			setTimeout(function() { unshuffle(elId, txt, shfpos, speed); }, speed);
		}

		window.addEventListener('load', function() {
			document.querySelectorAll('.year-num').forEach(function(el, idx) {
				el.id = 'ynum_' + idx;
				initShuffle(el, 450);
			});
			document.querySelectorAll('.year-word').forEach(function(el, idx) {
				el.id = 'yword_' + idx;
				initShuffle(el, 500);
			});
		});
	</script>
